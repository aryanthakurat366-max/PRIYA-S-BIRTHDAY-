<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Priya — Photos</title>
<meta property="og:title" content="Happy Birthday, Priya 🎂">
<meta property="og:description" content="A few favorites, just for you.">
<meta name="description" content="A few favorite photos, just for you, Priya.">
<meta name="theme-color" content="#340c09">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Tap-to-enter gate: guarantees the song can play with sound,
     since it starts right on the user's tap. -->
<div id="galleryGate" style="
  position:fixed; inset:0; z-index:1000;
  display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at top left, rgba(156,46,38,0.55) 0%, transparent 55%),
              radial-gradient(ellipse at bottom right, rgba(28,61,102,0.6) 0%, transparent 55%),
              linear-gradient(135deg, #7a1f18 0%, #340c09 38%, #060f1e 62%, #1c3d66 100%);
  cursor:pointer; text-align:center; padding:24px;">
  <div>
    <div style="width:84px;height:84px;margin:0 auto 18px;border-radius:50%;
      border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center;
      font-size:34px; background:rgba(255,204,102,0.08);">🎁</div>
    <div style="font-family:'Helvetica Neue', Arial, sans-serif; letter-spacing:0.2em;
      text-transform:uppercase; font-size:11px; color: var(--gold-soft);">Tap to open your photos</div>
  </div>
</div>

<div id="suitSuitPlayer" style="position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"></div>
<button id="suitSuitToggle" aria-label="Toggle Suit Suit song" style="
  position:fixed; bottom:18px; right:18px; z-index:999;
  background:linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
  color:#340c09; border:none; border-radius:999px;
  padding:10px 18px; font-family:'Helvetica Neue', Arial, sans-serif;
  font-size:14px; font-weight:600; letter-spacing:.02em;
  box-shadow:0 6px 20px rgba(0,0,0,0.35); cursor:pointer;
  display:none; align-items:center; gap:8px;">
  🎵 <span id="suitSuitLabel">Playing "Suit Suit" — tap to mute</span>
</button>

<nav class="page-nav">
  <a href="index.html" class="nav-link">Cover</a>
  <a href="message.html" class="nav-link">Your Card</a>
  <a href="gallery.html" class="nav-link active">Photos</a>
</nav>

<main>
  <div class="eyebrow">A little something for you, Priya</div>
  <h1>A Few <em>Favorites</em></h1>
  <div class="date-line">TAP A PHOTO TO ZOOM</div>
  <div class="divider"></div>

  <div class="gallery reveal" id="gallery">
    <div class="frame"><img src="assets/photo1.png" alt="Photo 1"></div>
    <div class="frame"><img src="assets/photo2.png" alt="Photo 2"></div>
    <div class="frame"><img src="assets/photo3.png" alt="Photo 3"></div>
    <div class="frame"><img src="assets/photo4.png" alt="Photo 4"></div>
    <div class="frame"><img src="assets/photo5.png" alt="Photo 5"></div>
  </div>

  <div class="page-actions reveal">
    <a href="message.html" class="candle-btn" style="text-decoration:none;">← Back to your card</a>
  </div>
</main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="Enlarged photo">
</div>

<footer>Made just for you</footer>

<script src="script.js"></script>

<script>
// Suit Suit song — plays with sound the moment the gate is tapped.
// Uses the official YouTube video via the IFrame API (we don't host the audio file ourselves).
(function(){
  var VIDEO_ID = "88LgZ-cf_P4"; // Suit Suit — official video, Hindi Medium (T-Series)
  var player, apiReady = false, gateTapped = false;
  var gate = document.getElementById("galleryGate");
  var toggleBtn = document.getElementById("suitSuitToggle");
  var label = document.getElementById("suitSuitLabel");

  function setLabel(playing){
    label.textContent = playing ? 'Playing "Suit Suit" — tap to mute' : 'Play "Suit Suit"';
  }

  window.onYouTubeIframeAPIReady = function(){
    apiReady = true;
    player = new YT.Player('suitSuitPlayer', {
      height: '1', width: '1', videoId: VIDEO_ID,
      playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 },
      events: {
        onReady: function(){
          toggleBtn.style.display = 'flex';
          if (gateTapped) startPlayback();
        },
        onStateChange: function(e){
          if (e.data === YT.PlayerState.PLAYING) setLabel(!player.isMuted());
        }
      }
    });
  };

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function startPlayback(){
    if (!apiReady || !player) return;
    player.unMute();
    player.setVolume(100);
    player.playVideo();
    setLabel(true);
  }

  gate.addEventListener('click', function(){
    gateTapped = true;
    gate.style.transition = 'opacity 0.5s ease';
    gate.style.opacity = '0';
    setTimeout(function(){ gate.style.display = 'none'; }, 500);
    startPlayback();
  });

  toggleBtn.addEventListener('click', function(){
    if (!apiReady || !player) return;
    if (player.isMuted() || player.getPlayerState() !== YT.PlayerState.PLAYING) {
      player.unMute();
      player.setVolume(100);
      player.playVideo();
      setLabel(true);
    } else {
      player.pauseVideo();
      setLabel(false);
    }
  });
})();
</script>

</body>
</html>
